name: Pruebas de sistema (E2E)

# Selenium sobre el frontend real: se clona Frontend-BPMN, se levanta con ng serve (su proxy apunta al
# backend en 8090) y ./mvnw verify -Pe2e arranca el backend en ese puerto y corre las pruebas con Chrome
# headless. Se ejecuta a mano (Actions -> Run workflow) eligiendo la rama del frontend que se quiere probar.
on:
  workflow_dispatch:
    inputs:
      rama_frontend:
        description: Rama de Frontend-BPMN contra la que se prueba
        required: true
        default: main

jobs:
  e2e:
    name: Selenium sobre el frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del backend
        uses: actions/checkout@v4

      - name: Checkout del frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Frontend-BPMN
          ref: ${{ inputs.rama_frontend }}
          path: frontend

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar y levantar el frontend
        working-directory: frontend
        run: |
          npm ci
          nohup npx ng serve --port 4200 > ../ng-serve.log 2>&1 &

      - name: Esperar a que Angular responda
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:4200 > /dev/null && exit 0
            sleep 2
          done
          cat ng-serve.log
          exit 1

      - name: Pruebas de sistema
        run: ./mvnw -B verify -Pe2e

      - name: Capturas de pantalla de cada prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e2e
          path: target/capturas/
