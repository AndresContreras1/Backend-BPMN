name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Compilar, probar y analizar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar necesita el historial completo para distinguir el codigo nuevo
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y ejecutar pruebas con cobertura
        run: ./mvnw -B verify

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/

      - name: Analisis SonarCloud
        # Se omite hasta que exista el secreto SONAR_TOKEN en el repositorio
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B sonar:sonar -Dsonar.token=$SONAR_TOKEN

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t backend-bpmn:ci .
