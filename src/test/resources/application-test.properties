# Perfil de pruebas: H2 en memoria, independiente de la base de desarrollo
# Se activa con @ActiveProfiles("test") y reemplaza la configuracion de la base real durante las pruebas
# Driver y URL de H2; MODE=PostgreSQL imita a PostgreSQL y DB_CLOSE_DELAY=-1 evita que la base se borre al cerrar la conexion
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas al arrancar y las borra al cerrar el contexto (no se usa Flyway en las pruebas)
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Las pruebas inician sesion y registran empresas muchas veces desde la misma IP
# Por eso se sube la capacidad del limite de intentos; RateLimitIT la baja a proposito para probarlo
app.rate-limit.login.capacidad=100000
app.rate-limit.registro.capacidad=100000
