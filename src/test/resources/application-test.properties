# Perfil de pruebas: H2 en memoria, independiente de la base de desarrollo
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Las pruebas inician sesion y registran empresas muchas veces desde la misma IP
app.rate-limit.login.capacidad=100000
app.rate-limit.registro.capacidad=100000
