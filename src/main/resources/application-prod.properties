# Perfil de produccion: PostgreSQL con credenciales por variables de entorno
# Conexion a PostgreSQL. Cada ${VARIABLE:valor} usa la variable de entorno o, si no existe, el valor despues de los dos puntos.
# DB_USER y DB_PASSWORD no tienen valor por defecto: son obligatorias
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:procesos}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Esquema versionado con Flyway (db/migration); Hibernate solo comprueba que las entidades cuadren
# Hibernate no crea ni cambia tablas: solo verifica que coincidan con las entidades
spring.jpa.hibernate.ddl-auto=validate
# Flyway aplica en orden los scripts V1, V2... de db/migration y registra cuales ya corrio
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Solo para una base creada antes de Flyway: marca su esquema como V1 y aplica desde la V2
# Permite adoptar una base que ya tiene tablas pero no historial de Flyway
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1

# La consola de H2 no existe en produccion
spring.h2.console.enabled=false

# Detras de nginx: respeta X-Forwarded-Proto/Host para las URL que genera la app (Swagger)
# Spring confia en los headers que agrega el proxy inverso
server.forward-headers-strategy=framework

# Swagger publicado en produccion es una decision: se apaga con SWAGGER_ENABLED=false
# Interruptor de Swagger UI y del contrato OpenAPI
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# Pools dimensionados para la maquina de produccion (hilos >= conexiones a la base de datos)
# Maximo de hilos que atienden peticiones a la vez
server.tomcat.threads.max=${THREADS:200}
# Maximo de conexiones abiertas a la base de datos (pool Hikari)
spring.datasource.hikari.maximum-pool-size=${DB_POOL:10}
