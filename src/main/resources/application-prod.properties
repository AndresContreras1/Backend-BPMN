# Perfil de produccion: PostgreSQL con credenciales por variables de entorno
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:procesos}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Esquema versionado con Flyway (db/migration); Hibernate solo comprueba que las entidades cuadren
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Solo para una base creada antes de Flyway: marca su esquema como V1 y aplica desde la V2
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1

spring.h2.console.enabled=false

# Detras de nginx: respeta X-Forwarded-Proto/Host para las URL que genera la app (Swagger)
server.forward-headers-strategy=framework

# Swagger publicado en produccion es una decision: se apaga con SWAGGER_ENABLED=false
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# Pools dimensionados para la maquina de produccion (hilos >= conexiones a la base de datos)
server.tomcat.threads.max=${THREADS:200}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:10}
