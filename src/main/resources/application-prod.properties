# Perfil de produccion: PostgreSQL con credenciales por variables de entorno
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:procesos}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# En PostgreSQL nunca create-drop: los datos se conservan entre despliegues
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false
