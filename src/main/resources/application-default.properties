# Perfil de desarrollo: H2 en archivo, se recrea en cada arranque
# Conexion a H2, una base de datos embebida que se guarda en un archivo dentro de ./data
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./data/bpmndb
# Usuario por defecto de H2, sin contrasena (solo para desarrollo local)
spring.datasource.username=sa
spring.datasource.password=

# Consola de administracion de H2: http://localhost:8090/h2
# Activa la consola web de H2; SecurityConfig le abre una cadena de filtros propia
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Hibernate crea las tablas a partir de las entidades al arrancar y las borra al cerrar.
# No se usa Flyway aqui: los datos de prueba los pone DataLoader
spring.jpa.hibernate.ddl-auto=create-drop

# Imprime las consultas SQL formateadas
# Muestra en el log cada consulta SQL que ejecuta Hibernate
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
# Descomentar para ver los parametros de cada consulta
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
