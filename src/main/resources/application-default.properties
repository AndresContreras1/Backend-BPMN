# Perfil de desarrollo: H2 en archivo, se recrea en cada arranque
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./data/bpmndb
spring.datasource.username=sa
spring.datasource.password=

# Consola de administracion de H2: http://localhost:8090/h2
spring.h2.console.enabled=true
spring.h2.console.path=/h2

spring.jpa.hibernate.ddl-auto=create-drop

# Imprime las consultas SQL formateadas
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
# Descomentar para ver los parametros de cada consulta
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
