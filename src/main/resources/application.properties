spring.application.name=backend-bpmn

# Puerto de la API del curso; en contenedores o en la nube llega por variable de entorno
server.port=${PORT:8090}

# JPA: sin sesion abierta en la vista; las relaciones se cargan en el servicio
spring.jpa.open-in-view=false

# Flyway solo en prod (PostgreSQL); en desarrollo y pruebas H2 se recrea con ddl-auto
spring.flyway.enabled=false

# Errores: ProblemDetail (RFC 9457) desde GlobalExceptionHandler y nunca detalles internos
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Paginacion por defecto de Spring Data Web
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# Jackson: fechas ISO-8601 y rechazo de campos desconocidos en el cuerpo
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=true

# Origenes permitidos para el frontend (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Documentación OpenAPI: solo la API REST, ordenada por método y etiqueta
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.paths-to-match=/api/**

# JWT: clave en Base64 (minimo 256 bits). Si esta vacia se genera una al arrancar
# y los tokens dejan de valer en cada reinicio (solo para desarrollo).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:1800}

# Limite de intentos por IP (cubo de fichas): login y registro de empresas. Pasado el limite, 429
app.rate-limit.login.capacidad=${RATE_LIMIT_LOGIN:10}
app.rate-limit.login.minutos=1
app.rate-limit.registro.capacidad=${RATE_LIMIT_REGISTRO:10}
app.rate-limit.registro.minutos=60
