# Nombre de la aplicacion; aparece en los logs y en las herramientas de monitoreo
spring.application.name=backend-bpmn

# Puerto de la API del curso; en contenedores o en la nube llega por variable de entorno
# ${PORT:8090} significa: usar la variable de entorno PORT y, si no existe, el valor 8090
server.port=${PORT:8090}

# JPA: sin sesion abierta en la vista; las relaciones se cargan en el servicio
# Desactiva Open Session In View: la conexion a la base se libera al terminar el servicio y no durante la
# respuesta HTTP. Si algo carga una relacion fuera del servicio falla, asi se detectan errores temprano
spring.jpa.open-in-view=false

# Flyway solo en prod (PostgreSQL); en desarrollo y pruebas H2 se recrea con ddl-auto
# Flyway (migraciones SQL) queda apagado por defecto; el perfil prod lo enciende
spring.flyway.enabled=false

# Errores: ProblemDetail (RFC 9457) desde GlobalExceptionHandler y nunca detalles internos
# Nunca se devuelve la traza, el mensaje ni los errores de binding en la pagina de error de Spring:
# no se filtran detalles internos al cliente
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Paginacion por defecto de Spring Data Web
# Tamano de pagina si el cliente no lo indica
spring.data.web.pageable.default-page-size=10
# Tope: aunque el cliente pida mas, no se devuelven mas de 100 registros por pagina
spring.data.web.pageable.max-page-size=100
# La primera pagina es la 0, no la 1
spring.data.web.pageable.one-indexed-parameters=false

# Jackson: fechas ISO-8601 y rechazo de campos desconocidos en el cuerpo
# Las fechas salen como texto ISO-8601 (2026-01-31T10:00:00Z) y no como numero
spring.jackson.serialization.write-dates-as-timestamps=false
# Si el JSON trae un campo que el DTO no tiene, se rechaza con 400 en vez de ignorarlo en silencio
spring.jackson.deserialization.fail-on-unknown-properties=true

# Origenes permitidos para el frontend (separados por coma)
# Por defecto el frontend de desarrollo (Angular en el puerto 4200)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Documentación OpenAPI: solo la API REST, ordenada por método y etiqueta
# Ruta del contrato OpenAPI en JSON
springdoc.api-docs.path=/v3/api-docs
# Ruta de la interfaz Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
# Orden de las operaciones y de las etiquetas en Swagger UI
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Solo se documentan los endpoints bajo /api
springdoc.paths-to-match=/api/**

# JWT: clave en Base64 (minimo 256 bits). Si esta vacia se genera una al arrancar
# y los tokens dejan de valer en cada reinicio (solo para desarrollo).
# Secreto de firma de los tokens, leido por JwtService
app.jwt.secret=${JWT_SECRET:}
# Duracion del token: 1800 segundos = 30 minutos
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:1800}

# Limite de intentos por IP (cubo de fichas): login y registro de empresas. Pasado el limite, 429
# Login: 10 intentos por IP cada 1 minuto
app.rate-limit.login.capacidad=${RATE_LIMIT_LOGIN:10}
app.rate-limit.login.minutos=1
# Registro de empresas: 10 intentos por IP cada 60 minutos
app.rate-limit.registro.capacidad=${RATE_LIMIT_REGISTRO:10}
app.rate-limit.registro.minutos=60
