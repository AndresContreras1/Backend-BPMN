spring.application.name=backend-bpmn

# Puerto de la API del curso; en contenedores o en la nube llega por variable de entorno
server.port=${PORT:8090}

# JPA: sin sesion abierta en la vista; las relaciones se cargan en el servicio
spring.jpa.open-in-view=false

# Errores: formato ProblemDetail (RFC 9457) y nunca detalles internos hacia el cliente
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Paginacion por defecto de Spring Data Web
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# Jackson: fechas ISO-8601 y rechazo de campos desconocidos en el cuerpo
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=true

# Origenes permitidos para el frontend (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
