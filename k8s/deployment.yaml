# Despliegue del backend en Kubernetes (microk8s del curso): Deployment + Service + Ingress.
#
# Antes del primer despliegue se crean en el servidor (nunca en el repositorio):
#   1. El namespace:       microk8s kubectl create namespace bpmn
#   2. El acceso a GHCR:   microk8s kubectl create secret docker-registry ghcr-secret -n bpmn \
#                            --docker-server=ghcr.io --docker-username=<usuario> --docker-password=<token> --docker-email=<correo>
#   3. Las credenciales:   microk8s kubectl create secret generic backend-bpmn-secretos -n bpmn \
#                            --from-literal=DB_HOST=... --from-literal=DB_NAME=... --from-literal=DB_USER=... \
#                            --from-literal=DB_PASSWORD=... --from-literal=JWT_SECRET=...
# JWT_SECRET es obligatorio con dos réplicas: si cada pod generara su propia clave, un token firmado
# por uno no valdría en el otro.
apiVersion: v1
kind: Namespace
metadata:
  name: bpmn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-bpmn
  namespace: bpmn
  labels:
    app: backend-bpmn
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-bpmn
  template:
    metadata:
      labels:
        app: backend-bpmn
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend-bpmn
          image: ghcr.io/andrescontreras1/backend-bpmn:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # El navegador entra por el mismo dominio del Ingress (frontend y API), así que no hay CORS
            - name: CORS_ALLOWED_ORIGINS
              value: https://bpmn.inphotech.co
          envFrom:
            - secretRef:
                name: backend-bpmn-secretos
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
---
# El Service se llama "backend": es el nombre que usa el nginx del frontend (proxy_pass http://backend:8090)
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: bpmn
spec:
  selector:
    app: backend-bpmn
  ports:
    - protocol: TCP
      port: 8090
      targetPort: 8090
---
# La API y Swagger por el dominio del grupo; la raíz (/) la atiende el Ingress del frontend.
# Cambiar el host por el subdominio asignado al grupo (<grupo>.inphotech.co).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-bpmn
  namespace: bpmn
spec:
  ingressClassName: public
  rules:
    - host: bpmn.inphotech.co
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8090
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8090
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8090
